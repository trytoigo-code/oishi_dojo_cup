<!--
================================================================================
  このアプリについて
  大石道場杯 — 設計思想と共同編集の進め方
================================================================================

【アプリの目的】
  大石道場杯の入口となるポータルページ。
  大会アプリ（tournament.html）と、囲碁クラブ下地会のホームページへのリンクを置く。

【利用環境】
  - スマホ利用を最優先とする（モバイルファースト）
  - GitHub Pages でホスティング（単一 index.html で完結）
  - 各アプリへのリンクを管理する

【技術構成】
  - 純粋なHTML/CSS（JavaScriptなし）
  - 外部ライブラリなし・ビルド不要・1ファイル完結
  - シンプルさを最優先とする

【共同編集の進め方】
  このアプリは、ユーザーと生成AIが対話しながら少しずつ育てていくものです。
  以下は、その共同作業をうまく続けるための共通認識です。

  ・このアプリの文脈と歴史を理解した上で提案する
  ・変更の意図と影響範囲を共有しながら進める
  ・小さな積み重ねを大切にし、一度に大きく変えない
  ・既存の操作感や雰囲気はできるだけ引き継ぐ
  ・読みやすく・触りやすく・壊れにくい構成を選ぶ
  ・新しい技術より、長く使い続けられることを優先する
  ・メニューを追加・変更したら「収録メニュー」を合わせて更新する

【収録メニュー（現時点）】
  - 大石道場杯（tournament.html）：午前は下地玄昭先生の指導碁会、午後は大会（3回戦）
  - 囲碁クラブ下地会（https://shimojikai.wsfpro.net/）：外部サイト。新しいタブで開く
================================================================================
-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大石道場杯</title>

  <style>
    :root { color-scheme: light; }
    html { background: #fcfaf2; }
    body {
      margin: 0;
      padding: 0;
      font-family: "Hiragino Kaku Gothic ProN", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fcfaf2;
      color: #333;
    }

    .wrap {
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 28px 18px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 6px;
      font-size: 1.5rem;
    }

    .sub {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
      font-size: 0.92rem;
    }

    .card {
      display: block;
      text-decoration: none;
      background: #fff;
      border: 1px solid #e0dbcd;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
      color: inherit;
      transition: 0.2s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .title {
      font-size: 1.08rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 6px;
    }

    .desc {
      font-size: 0.88rem;
      color: #666;
      line-height: 1.5;
    }

    .footer {
      margin-top: 34px;
      text-align: center;
      color: #999;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<div class="wrap">

  <h1>大石道場杯</h1>

  <a class="card" href="tournament.html">
    <div class="title">🏆 大石道場杯</div>
    <div class="desc">
      午前：下地玄昭先生の指導碁会<br>
      午後：大会（3回戦）
    </div>
  </a>

  <a class="card" href="https://shimojikai.wsfpro.net/" target="_blank" rel="noopener noreferrer">
    <div class="title">⚫ 囲碁クラブ下地会</div>
    <div class="desc">
      囲碁クラブ下地会のホームページを開きます。
    </div>
  </a>

  <div class="footer">
    GitHub Pages + Firebase
  </div>

</div>

</body>
</html>
