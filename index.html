<!--
================================================================================
  このアプリについて
  大石道場杯 — 設計思想と共同編集の進め方
================================================================================

【アプリの目的】
  大石道場杯の入口となるポータルページ。
  大会アプリ（tournament.html）と、囲碁クラブ下地会のホームページへのリンクを置く。

【利用環境】
  - スマホ利用を最優先とする（モバイルファースト）
  - GitHub Pages でホスティング（単一 index.html で完結）
  - 各アプリへのリンクを管理する

【技術構成】
  - 純粋なHTML/CSS（JavaScriptなし）
  - 外部ライブラリなし・ビルド不要・1ファイル完結
  - シンプルさを最優先とする

【共同編集の進め方】
  このアプリは、ユーザーと生成AIが対話しながら少しずつ育てていくものです。
  以下は、その共同作業をうまく続けるための共通認識です。

  ・このアプリの文脈と歴史を理解した上で提案する
  ・変更の意図と影響範囲を共有しながら進める
  ・小さな積み重ねを大切にし、一度に大きく変えない
  ・既存の操作感や雰囲気はできるだけ引き継ぐ
  ・読みやすく・触りやすく・壊れにくい構成を選ぶ
  ・新しい技術より、長く使い続けられることを優先する
  ・メニューを追加・変更したら「収録メニュー」を合わせて更新する

【収録メニュー（現時点）】
  - 大石道場杯（tournament.html）：午前は下地玄昭先生の指導碁会、午後は大会（3回戦）
  - 「リンク」見出しの下に、外部サイトへのリンクを4つ置く（説明文なし・新しいタブで開く）
      ・囲碁クラブ下地会のホームページ（https://shimojikai.wsfpro.net/）
      ・ブログ「下地会！　プロに勝つ　囲碁次の一手」（https://igoshimojikai.hatenablog.jp/）
      ・囲碁クラブ下地会のX（旧Twitter）（https://x.com/shimojikai2026?s=11）
      ・「対決！　昭和棋士 VS ＡＩ」のX（旧Twitter）（https://x.com/shimojikaiura?s=11）
================================================================================
-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大石道場杯</title>

  <style>
    :root { color-scheme: light; }
    html { background: #fcfaf2; }
    body {
      margin: 0;
      padding: 0;
      font-family: "Hiragino Kaku Gothic ProN", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fcfaf2;
      color: #333;
    }

    .wrap {
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 28px 18px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 6px;
      font-size: 1.5rem;
    }

    .sub {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
      font-size: 0.92rem;
    }

    .card {
      display: block;
      text-decoration: none;
      background: #fff;
      border: 1px solid #e0dbcd;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
      color: inherit;
      transition: 0.2s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .title {
      font-size: 1.08rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 6px;
    }

    .desc {
      font-size: 0.88rem;
      color: #666;
      line-height: 1.5;
    }

    .group-title {
      font-size: 0.82rem;
      color: #7a5c3a;
      letter-spacing: 0.05em;
      border-left: 4px solid #b89752;
      padding-left: 8px;
      margin: 26px 0 10px;
    }

    .link-card {
      padding: 14px 18px;
      margin-bottom: 10px;
    }

    .link-card .title {
      font-size: 0.98rem;
      margin-bottom: 0;
    }

    .footer {
      margin-top: 34px;
      text-align: center;
      color: #999;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<div class="wrap">

  <h1>大石道場杯</h1>

  <a class="card" href="tournament.html">

    <div class="desc">
      午前：下地玄昭先生の指導碁会<br>
      午後：大会（3回戦）
    </div>
  </a>

  <div class="group-title">🔗 リンク（外部サイトが開きます）</div>
    <a class="card link-card" href="https://shimojikai.wsfpro.net/" target="_blank" rel="noopener noreferrer">

    </a>
    <a class="card link-card" href="https://igoshimojikai.hatenablog.jp/" target="_blank" rel="noopener noreferrer">
      <div class="title">📝 ブログ「下地会！　プロに勝つ　囲碁次の一手」</div>
    </a>
    <a class="card link-card" href="https://x.com/shimojikai2026?s=11" target="_blank" rel="noopener noreferrer">
      <div class="title">𝕏 囲碁クラブ下地会のX（旧Twitter）</div>
    </a>
    <a class="card link-card" href="https://x.com/shimojikaiura?s=11" target="_blank" rel="noopener noreferrer">
      <div class="title">𝕏 「対決！　昭和棋士 VS ＡＩ」のX（旧Twitter）</div>
    </a>

  <div class="footer">
    GitHub Pages + Firebase
  </div>

</div>

</body>
</html>
